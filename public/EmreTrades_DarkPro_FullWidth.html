<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMRETRADES — Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05090c; --panel:#0b1216; --panel-2:#101a1f; --line:#17242a;
    --ink:#f1f5f6; --muted:#7f8c91; --gold:#45e0c2; --gold-dim:#2aa990;
    --green:#45e0c2; --red:#ff6674; --orange:#ffad4d; --blue:#4f8cff; --blue-2:#3b73e8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;overflow-x:hidden;}
  button,input,select,textarea{font-family:'Poppins',sans-serif;}
  .hidden{display:none !important;}

  /* ---- INTRO ---- */
  #intro{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;cursor:pointer;}
  #intro.out{animation:introOut .9s ease forwards;}
  @keyframes introOut{to{opacity:0;visibility:hidden;}}
  .tape{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);transform:scaleX(0);animation:tapeGrow 1.4s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes tapeGrow{to{transform:scaleX(1);}}
  .intro-title{font-weight:800;font-size:clamp(2rem,6vw,3.6rem);opacity:0;animation:fadeUp 1s ease forwards;animation-delay:.8s;text-align:center;letter-spacing:-0.01em;}
  .intro-title span{color:var(--gold);}
  .intro-sub{margin-top:.9rem;font-size:.85rem;color:var(--muted);font-weight:400;opacity:0;animation:fadeUp 1s ease forwards;animation-delay:1.2s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---- GATE ---- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
  .gate-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);padding:2rem 1.8rem;}
  .gate-brand{display:flex;align-items:center;gap:.5rem;margin-bottom:1.6rem;color:var(--gold);font-weight:700;font-size:1.1rem;}
  .gate-title{font-weight:700;font-size:1.3rem;margin-bottom:.3rem;}
  .gate-sub{color:var(--muted);font-size:.8rem;margin-bottom:1.4rem;font-weight:400;}
  .field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem;}
  .field label{font-size:.7rem;color:var(--muted);font-weight:500;}
  .field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:.65rem .7rem;font-size:.88rem;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:1px solid var(--gold);border-color:var(--gold);}
  .gate-error{color:var(--red);font-size:.76rem;margin-bottom:.8rem;}
  .gate-note{color:var(--muted);font-size:.7rem;margin-top:1.1rem;line-height:1.5;font-weight:400;}

  /* ---- SHELL ---- */
  #shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.5rem 1rem;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:baseline;gap:.2rem;padding:0 .4rem;margin-bottom:2rem;font-weight:700;font-size:1.1rem;}
  .brand .t2{color:var(--gold);}
  .nav{display:flex;flex-direction:column;gap:.2rem;flex:1;}
  .nav-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;background:none;border:none;color:var(--muted);font-size:.85rem;font-weight:500;cursor:pointer;text-align:left;border-left:2px solid transparent;width:100%;}
  .nav-item:hover{color:var(--ink);}
  .nav-item.active{color:var(--gold);background:var(--panel-2);border-left:2px solid var(--gold);}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .logout{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-align:left;}
  .logout:hover{color:var(--red);}
  .logout svg{width:15px;height:15px;}

  .main{flex:1;padding:2.2rem 2.4rem 4rem;min-width:0;}
  .page-header{margin-bottom:1.6rem;}
  .page-title{font-weight:700;font-size:1.5rem;margin:0;}
  .page-sub{color:var(--muted);font-size:.82rem;margin-top:.3rem;font-weight:400;}

  @media(max-width:780px){
    #shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:1rem;}
    .brand{margin-bottom:0;margin-right:1rem;}
    .nav{flex-direction:row;overflow-x:auto;flex:1;}
    .nav-item{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;}
    .nav-item.active{border-left:none;border-bottom:2px solid var(--gold);}
    .main{padding:1.6rem 1.2rem 3rem;}
  }

  /* ---- STATS ---- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:1.6rem;}
  .stat{background:var(--panel);padding:1rem 1.1rem;}
  .stat-label{font-size:.68rem;color:var(--muted);font-weight:500;}
  .stat-value{font-size:1.3rem;margin-top:.35rem;font-weight:700;}
  .pos{color:var(--green);} .neg{color:var(--red);}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);}}

  .panel-box{background:var(--panel);border:1px solid var(--line);padding:1.2rem;margin-bottom:1.6rem;}
  .panel-label{font-size:.7rem;color:var(--muted);font-weight:500;margin-bottom:.6rem;}
  .recent-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .recent-row:last-child{border-bottom:none;}

  /* ---- FORM ---- */
  .form-wrap{background:var(--panel);border:1px solid var(--line);padding:1.3rem;margin-bottom:1.6rem;}
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr 1fr;}}
  .field.span-3{grid-column:span 3;}
  @media(max-width:640px){.field.span-3{grid-column:span 2;}}
  .form-actions{display:flex;gap:.7rem;margin-top:1.1rem;}
  .btn-primary{background:var(--gold);color:#17130a;border:none;padding:.6rem 1.2rem;font-weight:600;font-size:.82rem;cursor:pointer;}
  .btn-primary:hover{background:#d9b25e;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:.6rem 1.2rem;font-size:.82rem;cursor:pointer;}
  .btn-ghost:hover{color:var(--ink);border-color:var(--gold-dim);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:.6rem 1.2rem;font-size:.82rem;cursor:pointer;}
  .add-btn{background:var(--gold);color:#17130a;border:none;padding:.6rem 1.05rem;font-size:.8rem;font-weight:600;cursor:pointer;}
  .add-btn:hover{background:#d9b25e;}

  /* ---- TABLE ---- */
  .filters{display:flex;gap:1.2rem;margin-bottom:.9rem;font-size:.78rem;color:var(--muted);}
  .filters button{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;padding:.2rem 0;border-bottom:1px solid transparent;font-weight:500;}
  .filters button.active{color:var(--gold);border-bottom:1px solid var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th{text-align:left;font-size:.68rem;color:var(--muted);font-weight:600;padding:.5rem .6rem;border-bottom:1px solid var(--line);}
  td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--panel);}
  .symbol{font-weight:700;}
  .dir-long{color:var(--green);font-size:.72rem;font-weight:600;} .dir-short{color:var(--red);font-size:.72rem;font-weight:600;}
  .notes{color:var(--muted);font-size:.78rem;max-width:220px;}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75rem;}
  .del:hover{color:var(--red);}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);border:1px dashed var(--line);}
  .empty-title{font-weight:700;font-size:1.2rem;color:var(--ink);margin-bottom:.4rem;}
  .error-msg{color:var(--red);font-size:.78rem;margin-bottom:1rem;}

  /* ---- CERTIFICATES ---- */
  .cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
  @media(max-width:780px){.cert-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.cert-grid{grid-template-columns:1fr;}}
  .cert{border:1px solid var(--line);padding:1.3rem 1.1rem;position:relative;background:var(--panel);}
  .cert.unlocked{border-color:var(--gold-dim);}
  .cert-icon{color:var(--gold-dim);margin-bottom:.7rem;}
  .cert.unlocked .cert-icon{color:var(--gold);}
  .cert-title{font-weight:700;font-size:1.05rem;margin-bottom:.3rem;}
  .cert.locked .cert-title,.cert.locked .cert-desc{opacity:.45;}
  .cert-desc{font-size:.78rem;color:var(--muted);line-height:1.4;font-weight:400;}
  .cert-check{position:absolute;top:1rem;right:1rem;color:var(--gold);}

  /* ---- SETTINGS ---- */
  .settings-section{background:var(--panel);border:1px solid var(--line);padding:1.3rem;margin-bottom:1.3rem;max-width:420px;}
  .settings-title{font-weight:700;font-size:1.05rem;margin-bottom:1rem;}
  .settings-msg{font-size:.8rem;color:var(--gold);margin-top:.8rem;}

  svg.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

<script>
/* ---------- ICONS (feather-style inline SVG) ---------- */
const ICONS = {
  accounts: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h6"/></svg>',
  news: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M7 9h10M7 13h7M7 16h5"/></svg>',
  analytics: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/></svg>',
  dashboard: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  journal: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  award: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>',
  settings: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  logout: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  lock: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
};

/* ---------- STATE ---------- */
const S = {
  trades: JSON.parse(localStorage.getItem('ej_trades') || '[]'),
  password: localStorage.getItem('ej_auth'),
  profile: JSON.parse(localStorage.getItem('ej_profile') || '{"name":""}'),
  view: 'dashboard',
  filter: 'all',
  formOpen: false,
  accounts: JSON.parse(localStorage.getItem('ej_accounts') || '[]'),
  activeAccount: localStorage.getItem('ej_active_account') || '',
  news: JSON.parse(localStorage.getItem('ej_news') || '[]'),
};
if(S.accounts.length){ if(!S.activeAccount) S.activeAccount=S.accounts[0].id; S.trades.forEach(t=>{if(!t.accountId)t.accountId=S.activeAccount}); localStorage.setItem('ej_active_account',S.activeAccount); localStorage.setItem('ej_trades',JSON.stringify(S.trades)); }

function saveTrades(){ localStorage.setItem('ej_trades', JSON.stringify(S.trades)); }
function saveAuth(){ localStorage.setItem('ej_auth', S.password); }
function saveProfile(){ localStorage.setItem('ej_profile', JSON.stringify(S.profile)); }
function saveAccounts(){ localStorage.setItem('ej_accounts', JSON.stringify(S.accounts)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function computePnl(t){
  if(t && t.pnl!==undefined && t.pnl!==null && String(t.pnl).trim()!==''){
    const entered=parseFloat(t.pnl);
    if(!isNaN(entered)) return entered;
  }
  // Eski kayıtlarda P&L alanı yoksa, eski Entry/Exit/Lot verisinden sonucu koru.
  const entry=parseFloat(t.entry), exit=parseFloat(t.exit), size=parseFloat(t.size);
  if(isNaN(entry)||isNaN(exit)||isNaN(size)) return 0;
  const diff = t.direction==='long' ? exit-entry : entry-exit;
  return diff*size;
}
function fmtMoney(n){
  const sign = n<0?'-':'';
  return sign+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ACHIEVEMENTS = [
  {id:'first', title:'İlk İşlem', desc:'Defterine ilk işlemini kaydettin.', test: s=>s.count>=1},
  {id:'ten', title:'10 İşlem', desc:'10 işlem kaydına ulaştın.', test: s=>s.count>=10},
  {id:'fifty', title:'50 İşlem', desc:'50 işlem kaydına ulaştın.', test: s=>s.count>=50},
  {id:'firstwin', title:'İlk Kazanç', desc:'İlk kârlı işlemini gerçekleştirdin.', test: s=>s.hasWin},
  {id:'streak', title:"5'li Seri", desc:'Üst üste 5 kazanan işlem yaptın.', test: s=>s.bestStreak>=5},
  {id:'positive', title:'Pozitif Defter', desc:'En az 5 işlemle toplamda kârdasın.', test: s=>s.count>=5 && s.total>0},
];

function getAccountTrades(){
  if(!S.activeAccount) return S.trades;
  return S.trades.filter(t=>!t.accountId || t.accountId===S.activeAccount);
}

function computeStats(){
  const accountTrades=getAccountTrades();
  if(accountTrades.length===0) return {total:0,count:0,winRate:0,avgWin:0,avgLoss:0,hasWin:false,bestStreak:0,equity:[]};
  const withPnl = accountTrades.map(t=>({...t,pnl:computePnl(t)})).sort((a,b)=>a.date.localeCompare(b.date));
  const total = withPnl.reduce((s,t)=>s+t.pnl,0);
  const wins = withPnl.filter(t=>t.pnl>0);
  const losses = withPnl.filter(t=>t.pnl<0);
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,t)=>s+t.pnl,0)/losses.length : 0;
  let streak=0,bestStreak=0;
  withPnl.forEach(t=>{ if(t.pnl>0){streak++;bestStreak=Math.max(bestStreak,streak);} else streak=0; });
  let cum=0; const equity = withPnl.map(t=>{cum+=t.pnl; return cum;});
  return {total,count:accountTrades.length,winRate:(wins.length/accountTrades.length)*100,avgWin,avgLoss,hasWin:wins.length>0,bestStreak,equity};
}

/* ---------- INTRO ---------- */
const introEl = document.getElementById('intro');
introEl.addEventListener('click', goToGate);
setTimeout(goToGate, 3000);
let introGone = false;
function goToGate(){
  if(introGone) return;
  introGone = true;
  introEl.classList.add('out');
  setTimeout(()=>{ introEl.classList.add('hidden'); renderGate(); document.getElementById('gate').classList.remove('hidden'); }, 500);
}

/* ---------- GATE ---------- */
function renderGate(){
  const gate = document.getElementById('gate');
  const hasPw = !!S.password;
  gate.innerHTML = `
    <div class="gate-card">
      <div class="gate-brand">${ICONS.lock} EmreTrades</div>
      ${hasPw ? `
        <div class="gate-title">Tekrar hoş geldin</div>
        <div class="gate-sub">Devam etmek için şifreni gir.</div>
        <div id="gateError" class="gate-error hidden"></div>
        <div class="field"><label>Şifre</label><input type="password" id="loginPw" autofocus></div>
        <button class="btn-primary" style="width:100%" id="loginBtn">Giriş yap</button>
      ` : `
        <div class="gate-title">Şifreni oluştur</div>
        <div class="gate-sub">Bu şifre yalnızca bu tarayıcıda saklanır, gerçek bir güvenlik sistemi değildir.</div>
        <div id="gateError" class="gate-error hidden"></div>
        <div class="field"><label>Şifre</label><input type="password" id="setupPw" autofocus></div>
        <div class="field"><label>Şifre (tekrar)</label><input type="password" id="setupPwConfirm"></div>
        <button class="btn-primary" style="width:100%" id="setupBtn">Oluştur ve gir</button>
      `}
    </div>
  `;
  const err = document.getElementById('gateError');
  function showErr(msg){ err.textContent = msg; err.classList.remove('hidden'); }

  if(hasPw){
    const pwInput = document.getElementById('loginPw');
    function doLogin(){
      if(pwInput.value !== S.password){ showErr('Şifre yanlış.'); return; }
      enterApp();
    }
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  } else {
    function doSetup(){
      const pw = document.getElementById('setupPw').value;
      const pw2 = document.getElementById('setupPwConfirm').value;
      if(pw.length<4){ showErr('Şifre en az 4 karakter olmalı.'); return; }
      if(pw!==pw2){ showErr('Şifreler uyuşmuyor.'); return; }
      S.password = pw; saveAuth();
      enterApp();
    }
    document.getElementById('setupBtn').addEventListener('click', doSetup);
  }
}

function enterApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  renderShell();
}

/* ---------- SHELL / APP ---------- */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard'},
  {id:'journal', label:'Journal', icon:'journal'},
  {id:'analytics', label:'Analiz', icon:'analytics'},
  {id:'accounts', label:'Accounts', icon:'accounts'},
  {id:'news', label:'News', icon:'news'},
  {id:'certificates', label:'Certificates', icon:'award'},
  {id:'settings', label:'Ayarlar', icon:'settings'},
];

function getTurkeyNow(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Istanbul',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const out={}; parts.forEach(p=>out[p.type]=p.value); return out;
}
function isForexMarketOpen(){
  const t=getTurkeyNow();
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(t.weekday);
  const minutes=Number(t.hour)*60+Number(t.minute);
  // Kullanıcının istediği gösterim: 00:00–00:59 kapalı, 01:00–23:59 açık.
  // Hafta sonu ise forex piyasası kapalıdır.
  if(day===0 || day===6) return false;
  return minutes>=60;
}
function updateMarketStatus(){
  const el=document.getElementById('marketStatus');
  if(!el) return;
  const open=isForexMarketOpen();
  el.classList.toggle('closed',!open);
  const span=el.querySelector('span'); if(span) span.textContent=open?'PİYASA AÇIK':'PİYASA KAPALI';
}
function startMarketStatusClock(){
  updateMarketStatus();
  clearInterval(window.__marketStatusTimer);
  window.__marketStatusTimer=setInterval(updateMarketStatus,15000);
}

function renderShell(){
  const shell=document.getElementById('shell');
  const name=S.profile.name || 'Emre';
  shell.innerHTML=`
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22 12 15l5 4 9-10"/><path d="M20 9h6v6"/></svg></span>
        <span class="brand-word"><span>EMRE</span><b>TRADES</b></span>
      </div>
      <div class="nav-section-label">WORKSPACE</div>
      <div class="nav" id="navList"></div>
      <div class="sidebar-bottom" id="navBottom"></div>
      <div class="profile-mini">
        <div class="profile-avatar" aria-label="Emre profil fotoğrafı"></div>
        <div class="profile-copy"><div class="pname">${escapeHtml(name)}</div><div class="prole">Trader</div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">WORKSPACE / <strong id="crumbPage">${NAV.find(x=>x.id===S.view)?.label||'Dashboard'}</strong></div>
        <div class="top-actions">
          <div class="market-status" id="marketStatus"><i></i> <span>PİYASA AÇIK</span></div>
          <button class="ai-btn" id="aiCoach">✦ &nbsp; AI Koç</button>
          <button class="new-trade-top" id="topNewTrade"><span>＋</span> Yeni İşlem</button>
        </div>
      </header>
      <div id="contentArea"></div>
    </main>`;

  updateMarketStatus();
  startMarketStatusClock();

  const navList=document.getElementById('navList');
  const navBottom=document.getElementById('navBottom');
  NAV.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='nav-item'+(S.view===item.id?' active':'');
    btn.innerHTML=`${ICONS[item.icon]} <span>${item.label}</span>`;
    btn.addEventListener('click',()=>{S.view=item.id;S.formOpen=false;renderShell();});
    (item.id==='settings'?navBottom:navList).appendChild(btn);
  });

  document.getElementById('topNewTrade').addEventListener('click',()=>{S.view='journal';S.formOpen=true;renderShell();});
  document.getElementById('aiCoach').addEventListener('click',openCoach);
  renderMain();
}

function openCoach(){
  const stats=computeStats(); const wins=S.trades.filter(t=>computePnl(t)>0).length; const losses=S.trades.filter(t=>computePnl(t)<0).length;
  const recent=S.trades.slice(0,8); const setupCounts={}; recent.forEach(t=>{const k=(t.setup||'Setup belirtilmedi').trim();setupCounts[k]=(setupCounts[k]||0)+1});
  const topSetup=Object.entries(setupCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  const advice=stats.count===0?'Henüz yeterli veri yok. Önce işlemlerini düzenli kaydet.':stats.winRate>=60?'Win rate güçlü. Şimdi aynı setup ve risk disiplinini korumaya odaklan.':stats.winRate>=45?'Performans dengeli. Kaybeden işlemlerde ortak setup/hata desenlerini incele.':'Öncelik işlem sayısını artırmak değil, seçiciliği artırmak. Kalitesiz setupları ele.';
  const old=document.getElementById('coachModal'); if(old)old.remove(); const el=document.createElement('div');el.id='coachModal';el.className='modal-backdrop';el.innerHTML=`<div class="modal-pro coach-modal"><div class="modal-head"><div><div class="eyebrow">EMRETRADES AI</div><h3>AI Koç</h3></div><button class="modal-x" id="closeCoach">×</button></div><div class="coach-summary"><div><span>WIN RATE</span><b>${stats.count?stats.winRate.toFixed(0)+'%':'—'}</b></div><div><span>TRADES</span><b>${stats.count}</b></div><div><span>BEST STREAK</span><b>${stats.bestStreak}</b></div><div><span>TOP SETUP</span><b>${escapeHtml(topSetup)}</b></div></div><div class="coach-message"><strong>Koç değerlendirmesi</strong><p>${advice}</p></div><div class="coach-message"><strong>Bugünkü odak</strong><p>Riskini planlı tut, giriş nedenini netleştir ve işlem bittikten sonra dersini journal'a yaz.</p></div></div>`;document.body.appendChild(el);document.getElementById('closeCoach').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};
}

function renderMain(){
  const main = document.getElementById('contentArea');
  const stats = computeStats();
  if(S.view==='dashboard') return renderDashboard(main, stats);
  if(S.view==='journal') return renderJournal(main, stats);
  if(S.view==='accounts') return renderAccounts(main);
  if(S.view==='news') return renderNews(main);
  if(S.view==='analytics') return renderAnalytics(main, stats);
  if(S.view==='certificates') return renderCertificates(main, stats);
  if(S.view==='settings') return renderSettings(main);
}

function getTurkeyGreeting(){
  const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Istanbul',hour:'2-digit',hour12:false}).format(new Date()));
  return hour>=6 && hour<=19 ? 'Günaydın, Emre.' : 'İyi Geceler, Emre.';
}

function renderDashboard(main, stats){
  const account=S.accounts.find(a=>a.id===S.activeAccount)||S.accounts[0];
  if(account && S.activeAccount!==account.id){S.activeAccount=account.id;localStorage.setItem('ej_active_account',S.activeAccount);}
  const start=account?Number(account.startBalance||0):0;
  const balance=start+stats.total;
  const ret=start?(stats.total/start)*100:0;
  const accountTrades=getAccountTrades();
  const wins=accountTrades.filter(t=>computePnl(t)>0).length;
  const losses=accountTrades.filter(t=>computePnl(t)<0).length;
  const recent=accountTrades.slice(0,5);
  const maxLoss=account?Number(account.maxLoss||0):0;
  const dd=maxLoss&&stats.total<0?Math.min(100,Math.abs(stats.total)/maxLoss*100):0;
  const recentHtml=recent.length?recent.map(t=>{const pnl=computePnl(t);return `<div class="dash-trade"><div><b>${escapeHtml(t.symbol||'—')}</b><span>${t.date||'—'} · ${escapeHtml(t.setup||'Setup')}</span></div><div class="dash-trade-right"><em class="${t.direction==='long'?'dir-long':'dir-short'}">${t.direction==='long'?'LONG':'SHORT'}</em><strong class="${pnl>=0?'pos':'neg'}">${fmtMoney(pnl)}</strong></div></div>`}).join(''):`<div class="empty-mini">Bu hesapta henüz işlem kaydı yok.</div>`;
  const curve=stats.equity.length>1?`<svg viewBox="0 0 800 180" preserveAspectRatio="none" class="equity-chart"><path d="${stats.equity.map((v,i)=>{let min=Math.min(...stats.equity),max=Math.max(...stats.equity),r=(max-min)||1;let x=12+i/(stats.equity.length-1)*776,y=160-(v-min)/r*125;return `${i?'L':'M'} ${x} ${y}`}).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>`:`<div class="chart-empty">Performans eğrisi işlemler eklendikçe burada oluşur.</div>`;
  const accountOptions=S.accounts.map(a=>`<option value="${a.id}" ${account&&a.id===account.id?'selected':''}>${escapeHtml(a.name)}${a.firm?' · '+escapeHtml(a.firm):''}</option>`).join('');
  main.innerHTML=`
    <section class="dash-welcome clean-welcome"><div><div class="eyebrow">TRADING WORKSPACE</div><h1>${getTurkeyGreeting()}</h1><p>Bugünün odağı: kaliteli setup, kontrollü risk, temiz execution.</p></div><div class="dash-account-select"><label>HESAP SEÇ</label><select id="dashboardAccountSelect" ${S.accounts.length?'':'disabled'}>${S.accounts.length?accountOptions:'<option>Önce hesap ekle</option>'}</select></div></section>
    <section class="metric-grid">
      <div class="metric"><span>BALANCE</span><strong>${account?fmtMoney(balance):'—'}</strong><small>${account?escapeHtml(account.name):'Accounts bölümünden hesap ekle'}</small></div>
      <div class="metric"><span>TOTAL P&L</span><strong class="${stats.total>=0?'pos':'neg'}">${fmtMoney(stats.total)}</strong><small>${ret>=0?'+':''}${ret.toFixed(2)}% getiri</small></div>
      <div class="metric"><span>WIN RATE</span><strong>${stats.count?stats.winRate.toFixed(0)+'%':'—'}</strong><small>${wins} kazanç · ${losses} kayıp</small></div>
      <div class="metric"><span>TRADES</span><strong>${stats.count}</strong><small>En iyi seri: ${stats.bestStreak}</small></div>
    </section>
    <section class="dash-layout"><div class="dash-main-col"><div class="pro-card"><div class="section-head"><div><span class="eyebrow">PERFORMANCE</span><h3>Equity Curve</h3></div><span>${stats.count} işlem</span></div>${curve}</div><div class="pro-card"><div class="section-head"><div><span class="eyebrow">JOURNAL</span><h3>Son İşlemler</h3></div><button class="text-btn" id="seeJournal">Tümünü gör →</button></div><div class="trade-list">${recentHtml}</div></div></div>

function renderJournal(main, stats){

    document.getElementById('cancelFormBtn').onclick=()=>{S.formOpen=false;renderJournal(main,computeStats())};
  }
  if(S.trades.length){document.querySelectorAll('.filter-pills button').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderJournal(main,computeStats())});const search=document.getElementById('tradeSearch');search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll('#tableHost tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};}
  const host=document.getElementById('tableHost');
  if(!visible.length){host.innerHTML=`<div class="empty-pro">Bu filtrede işlem bulunmuyor.</div>`;return;}
  host.innerHTML=`<div class="table-pro"><table><thead><tr><th>TARİH</th><th>VARLIK</th><th>YÖN</th><th>SETUP</th><th>ENTRY</th><th>SL</th><th>TP</th><th>P&L</th><th>İŞLEM</th></tr></thead><tbody>${visible.map(t=>{const p=t.pnl;return `<tr><td>${t.date||'—'}</td><td><b>${escapeHtml(t.symbol||'—')}</b></td><td><span class="side-badge ${t.direction==='long'?'long':'short'}">${t.direction==='long'?'LONG':'SHORT'}</span></td><td>${escapeHtml(t.setup||'—')}</td><td>${escapeHtml(t.entry||'—')}</td><td>${escapeHtml(t.sl||t.exit||'—')}</td><td>${escapeHtml(t.tp||'—')}</td><td class="${p>=0?'pos':'neg'}"><b>${fmtMoney(p)}</b></td><td><button class="icon-delete del" data-id="${t.id}" title="Sil">×</button></td></tr>`}).join('')}</tbody></table></div>`;
  host.querySelectorAll('.del').forEach(b=>b.onclick=()=>{S.trades=S.trades.filter(t=>t.id!==b.dataset.id);saveTrades();renderJournal(main,computeStats())});

function renderNews(main){
  const fallback=[
    {time:'09:00',currency:'GBP',impact:'red',event:'CPI y/y'},
    {time:'15:30',currency:'USD',impact:'orange',event:'Core Retail Sales m/m'},
    {time:'15:30',currency:'USD',impact:'orange',event:'Retail Sales m/m'},
    {time:'21:00',currency:'USD',impact:'red',event:'Federal Funds Rate'},
    {time:'21:00',currency:'USD',impact:'red',event:'FOMC Economic Projections'},
    {time:'21:00',currency:'USD',impact:'red',event:'FOMC Statement'},
    {time:'21:30',currency:'USD',impact:'red',event:'FOMC Press Conference'}
  ];
  const trtParts=(date)=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);const o={};parts.forEach(p=>o[p.type]=p.value);return `${o.year}-${o.month}-${o.day}`;};
  const timeTrt=(date)=>new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
  const labelTrt=(date)=>new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',year:'numeric'}).format(date);
  const now=new Date();
  const todayKey=trtParts(now);
  const tomorrowDate=new Date(now.getTime()+86400000);
  const tomorrowKey=trtParts(tomorrowDate);
  const fallbackLabel=`Yarın · ${labelTrt(tomorrowDate)} · Türkiye saati`;
  const renderItems=(items,label,status='Güncel')=>{
    const html=items.length?items.map(n=>`<div class="news-row"><div class="news-time">${n.time}</div><div class="news-currency">${n.currency}</div><div class="news-impact ${n.impact}"><i></i></div><div class="news-event">${escapeHtml(n.event)}</div></div>`).join(''):`<div class="empty-mini">Yarın için yüksek/orta etkili haber bulunamadı.</div>`;
    main.innerHTML=`<div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap"><div><div class="eyebrow">ECONOMIC CALENDAR</div><h1 class="page-title">News</h1><div class="page-sub" id="newsDate">${label} · ${status}</div></div><a class="outline-btn" href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Forex Factory ↗</a></div><div class="panel-box news-panel"><div class="news-legend"><span class="news-red">● Kırmızı · High Impact</span><span class="news-orange">● Turuncu · Medium Impact</span><span class="news-source">TRT · Europe/Istanbul</span></div><div class="news-list">${html}</div><div class="news-foot">Sadece yarının High ve Medium etkili haberleri gösterilir. Veri kaynağı: Forex Factory.</div></div>`;
  };
  // İlk açılışta beklenen yarınlık listeyi göster; canlı veri gelince bunun yerini otomatik olarak güncel veri alır.
  renderItems(fallback,fallbackLabel,'Yükleniyor…');
  const url='https://nfs.faireconomy.media/ff_calendar_thisweek.json';
  fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error('calendar fetch failed');return r.json();}).then(data=>{
    const items=data.filter(x=>['High','Medium'].includes(x.impact)).map(x=>{
      const d=new Date(x.date); if(isNaN(d.getTime())) return null;
      if(trtParts(d)!==tomorrowKey) return null;
      return {time:timeTrt(d),currency:x.country||'',impact:x.impact==='High'?'red':'orange',event:x.title||''};
    }).filter(Boolean).sort((a,b)=>a.time.localeCompare(b.time));
    renderItems(items,`Yarın · ${labelTrt(tomorrowDate)} · Türkiye saati`,'Güncel');
  }).catch(()=>{
    renderItems(fallback,fallbackLabel,'Canlı veri alınamadı · gösterilen liste yedek veridir');
  });
}

    </div>

    <div id="settingsMsg" class="settings-msg hidden"></div>
  `;

  const msg = document.getElementById('settingsMsg');
  function showMsg(text){ msg.textContent = text; msg.classList.remove('hidden'); }

  document.getElementById('nameForm').addEventListener('submit', e=>{
    e.preventDefault();
    S.profile.name = document.getElementById('nameInput').value;
    saveProfile();
    showMsg('İsim güncellendi.');
  });

  document.getElementById('pwForm').addEventListener('submit', e=>{
    e.preventDefault();
    const old = document.getElementById('pwOld').value;
    const nw = document.getElementById('pwNew').value;
    const nw2 = document.getElementById('pwNewConfirm').value;
    if(old !== S.password) return showMsg('Mevcut şifre yanlış.');
    if(nw.length<4) return showMsg('Yeni şifre en az 4 karakter olmalı.');
    if(nw !== nw2) return showMsg('Yeni şifreler uyuşmuyor.');
    S.password = nw; saveAuth();
    document.getElementById('pwOld').value=''; document.getElementById('pwNew').value=''; document.getElementById('pwNewConfirm').value='';
    showMsg('Şifre güncellendi.');
  });

  const dz = document.getElementById('dangerZone');
  function showAskState(){
    dz.innerHTML = `
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:.8rem;">Emin misin? Bu işlem geri alınamaz.</div>

      </div>
    `;
    document.getElementById('confirmReset').addEventListener('click', ()=>{
      S.trades = []; saveTrades();
      showIdleState();
      showMsg('Tüm işlemler silindi.');
    });
    document.getElementById('cancelReset').addEventListener('click', showIdleState);
  }
  function showIdleState(){
    dz.innerHTML = `<button class="btn-danger" id="resetBtn">Tüm işlemleri sil</button>`;
    document.getElementById('resetBtn').addEventListener('click', showAskState);
  }
  document.getElementById('resetBtn').addEventListener('click', showAskState);
}
